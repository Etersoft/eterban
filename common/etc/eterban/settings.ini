[Settings]
# blocking requests queue
#redis_server = 10.20.30.101
#redis_port = 6379
# Optional Redis ACL/TLS settings. Keep this file root-readable only when a
# password is configured.
#redis_username = default
#redis_password = change-this-secret
#redis_tls = false
# Redis stores the authoritative active-ban set. Configure the Redis server
# with durable persistence (for example: appendonly yes, appendfsync everysec).

# Redirect banned external clients to the public ban page on ban_server:81.
# Internal clients are redirected to ban_server:82 when internal_interface is set.
#ban_server = 192.168.0.0

# Input interface
#i_interface = brlocal

# Second input interface
#i_interface2 = brlocal2

# List of WAN interfaces (preferred over i_interface/i_interface2)
# Comma and/or space separated, e.g.: ether1, ether3, enp8s0f0
#i_interfaces = ether1, ether3

# Internal interface (for blocking outgoing connections to banned IPs)
# When internal users access banned IPs on ports 80/443,
# traffic is redirected to ban_server (DNAT by destination, not source)
#internal_interface = vmbr0

#hostname = localhost

# Maximum number of entries in ipset (default: 2000000)
#maxelem = 2000000

# Whitelist file: one IPv4/IPv6 address or CIDR network per line, '#' for comments.
# Loaded into ipset eterban_white (and eterban_white_ipv6) on service start.
# Whitelisted IPs are never added to the ban ipset and bypass DNAT to ban_server.
# Default: /etc/eterban/whitelist.txt
#whitelist_file = /etc/eterban/whitelist.txt

[API]
# API server for checking if IP is banned
listen_host = 127.0.0.1
listen_port = 8275
# Required when listen_host is not a literal loopback address. Send it as:
# Authorization: Bearer <api_token>
#api_token = change-this-to-a-long-random-secret
# Per-client request limit. Default: 60.
#rate_limit_per_minute = 60

[AutoUnban]
# Enable automatic unbanning with exponential backoff
enabled = true

# Base ban duration for first offense (seconds)
# Default: 3600 (1 hour)
base_ban_seconds = 3600

# Backoff multiplier for each subsequent offense
# Duration = base_ban_seconds * (backoff_multiplier ^ (offense_count - 1))
# With multiplier=4: 1h -> 4h -> 16h -> 64h -> permanent
backoff_multiplier = 4

# Maximum offense level before permanent ban
# offense_count > max_offense_level = permanent ban
max_offense_level = 4

# Period after which offense counter resets (days)
# If IP is clean for this period, counter resets to 0
reset_period_days = 365

# How often to check for expired bans (seconds)
check_interval_seconds = 60
